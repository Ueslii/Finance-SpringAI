<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>fInAnce</title>
    <meta name="description" content="Sua plataforma de gerenciar finanças com IA sob seu controle">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            line-height: 1.5;
            margin: 0;
            padding: 1.5rem 1rem;
            background: #f5f7fb;
            color: #1f2937;
        }

        main {
            max-width: 44rem;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.75rem;
        }

        header p {
            margin: 0.25rem 0 0;
            color: #4b5563;
        }

        #messages {
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 0.75rem;
            padding: 1rem;
            min-height: 18rem;
            max-height: 55vh;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .message {
            margin: 0;
            padding: 0.75rem 1rem;
            border-radius: 0.75rem;
            max-width: 85%;
            white-space: pre-wrap;
        }

        .message-user {
            align-self: flex-end;
            background: #0b57d0;
            color: #ffffff;
        }

        .message-assistant {
            align-self: flex-start;
            background: #eef2ff;
            color: #1e293b;
        }

        .message-error {
            align-self: flex-start;
            background: #fee2e2;
            color: #991b1b;
        }

        #chat {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
        }

        label {
            font-weight: 600;
        }

        .hint {
            font-size: 0.875rem;
            color: #4b5563;
        }

        textarea {
            font: inherit;
            font-size: max(1rem, 1em);
            padding: 0.75rem;
            min-height: 4.5rem;
            border: 1px solid #767676;
            border-radius: 0.5rem;
            resize: vertical;
        }

        button {
            font: inherit;
            font-size: max(1rem, 1em);
            font-weight: 600;
            min-height: 48px;
            padding: 0.75rem 1.25rem;
            border: none;
            border-radius: 0.5rem;
            background: #0b57d0;
            color: #ffffff;
            cursor: pointer;
            align-self: flex-end;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        textarea:focus-visible,
        button:focus-visible {
            outline: 3px solid #0b57d0;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
<main>
    <header>
        <h1>fInAnce</h1>
        <p>Finanças pessoais</p>
    </header>

    <section id="messages" aria-live="polite" aria-label="Histórico da conversa">
        <p class="message message-assistant">Assistente: Olá! Me diga um gasto para registrar ou pergunte quanto você já gastou em uma categoria.</p>
    </section>

    <form id="chat">
        <div class="field">
            <label for="messages-input">Mensagem</label>
            <textarea id="messages-input" name="message" aria-describedby="chat-hint" placeholder="Ex.: Gastei 45 reais no mercado" required></textarea>
            <span id="chat-hint" class="hint">Pressione Enter para enviar ou Shift + Enter para quebrar linha.</span>
        </div>
        <button type="submit" id="Botao">Enviar</button>
    </form>
</main>

<script>
    const form = document.getElementById('chat');
    const input = document.getElementById('messages-input');
    const messages = document.getElementById('messages');
    const button = document.getElementById('Botao');

    function appendMessage(author, text, cssClass) {
        const item = document.createElement('p');
        item.className = `message ${cssClass}`;
        item.textContent = `${author}: ${text}`;
        messages.appendChild(item);
        messages.scrollTop = messages.scrollHeight;
    }

    input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey) {
            event.preventDefault();
            if (event.isComposing || event.keyCode === 229) {
                return;
            }
            form.requestSubmit();
        }
    });

    form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const message = input.value.trim();
        if (!message) {
            return;
        }

        appendMessage('Você', message, 'message-user');
        input.value = '';
        button.disabled = true;

        try {
            const response = await fetch('/transactions/ai/text', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            if (!response.ok) {
                throw new Error(`Erro HTTP ${response.status}`);
            }

            const data = await response.json();
            appendMessage('Assistente', data.reply, 'message-assistant');
        } catch (error) {
            appendMessage('Erro', 'Não foi possível processar sua mensagem. Confira se a API está rodando.', 'message-error');
        } finally {
            button.disabled = false;
            input.focus();
        }
    });
</script>
</body>
</html>
